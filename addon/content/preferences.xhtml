<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <html:label>
    <html:input type="checkbox" id="__addonRef__-citation-enabled" />
    启用被引次数
  </html:label>
  <html:label>
    <html:input type="checkbox" id="__addonRef__-citation-autoUpdate" />
    自动查询并更新过期记录
  </html:label>
  <description>
    自动更新默认关闭，可在条目右键菜单中手动更新。查询会向 OpenAlex 发送 DOI
    或标题。
  </description>
  <hbox align="center">
    <html:label for="__addonRef__-citation-cacheDays"
      >缓存有效期（天）</html:label
    >
    <html:input
      type="number"
      min="1"
      max="365"
      id="__addonRef__-citation-cacheDays"
    />
  </hbox>
  <hbox align="center">
    <html:label for="__addonRef__-citation-openAlexKey"
      >OpenAlex API Key（可选）</html:label
    >
    <html:input
      type="password"
      autocomplete="off"
      id="__addonRef__-citation-openAlexKey"
    />
  </hbox>
  <description>
    密钥保存在本机首选项中，免费 Key
    可提高每日额度。手动次数不会被自动更新覆盖。
  </description>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
